name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (lint + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build (the bootloader, the connect screen and sw.js)
        run: node scripts/build.mjs /PeerPages/
      - name: The expected output files
        run: |
          test -f dist/sw.js            # at the scope root, unhashed
          test -f dist/index.html       # the bootloader
          test -f dist/connect/index.html  # the connect screen

  agent:
    name: agent (lint + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.x"
          cache-dependency-path: agent/go.sum
      - run: gofmt -l . | tee /dev/stderr | (! read)
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: agent
      - run: go test ./... -race

  agent-platforms:
    # So every PR shows it builds on all three platforms: the release
    # workflow only runs on a tag, and learning about a breakage there
    # would be far too late.
    name: agent (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.x"
          cache-dependency-path: agent/go.sum
      - run: go build ./...
      - run: go test ./...

  e2e:
    name: e2e (the phase 1 acceptance criteria)
    runs-on: ubuntu-latest
    needs: [web, agent]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.x"
          cache-dependency-path: agent/go.sum
      - name: Build the agent and generate the test data
        working-directory: agent
        run: |
          if [ -d internal/testsite/gen ]; then go run ./internal/testsite/gen; fi
          go build -o peerpages .
      - name: The web dependencies
        working-directory: web
        run: npm ci
      - name: Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: E2E (the manual path plus the Nostr path, with a fake relay)
        working-directory: web
        # The Nostr tests use an in-process fake relay, so CI does not
        # depend on real internet relays. Running against real relays is
        # done by hand:
        # PEERPAGES_E2E_RELAYS="wss://nos.lol" npm run e2e
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
