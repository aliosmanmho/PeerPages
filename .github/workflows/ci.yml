name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (lint + birim test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Derleme (onyukleyici + baglanti ekrani + sw.js)
        run: node scripts/build.mjs /PeerPages/
      - name: Beklenen cikti dosyalari
        run: |
          test -f dist/sw.js            # scope kokunde, hash'siz
          test -f dist/index.html       # onyukleyici
          test -f dist/connect/index.html  # baglanti ekrani

  agent:
    name: agent (lint + birim test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.x"
          cache-dependency-path: agent/go.sum
      - run: gofmt -l . | tee /dev/stderr | (! read)
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: agent
      - run: go test ./... -race

  agent-platforms:
    # Uc platformda derlendigini her PR'da gormek icin: release
    # workflow'u yalnizca etiket atilinca kosuyor, o yuzden kirilmayi
    # orada ogrenmek cok gec olur.
    name: agent (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.x"
          cache-dependency-path: agent/go.sum
      - run: go build ./...
      - run: go test ./...

  e2e:
    name: e2e (Faz 1 kabul kriterleri)
    runs-on: ubuntu-latest
    needs: [web, agent]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.x"
          cache-dependency-path: agent/go.sum
      - name: Ajani derle ve test verisini uret
        working-directory: agent
        run: |
          if [ -d internal/testsite/gen ]; then go run ./internal/testsite/gen; fi
          go build -o peerpages .
      - name: Web bagimliliklari
        working-directory: web
        run: npm ci
      - name: Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: E2E (elle yol + Nostr yolu, sahte relay)
        working-directory: web
        # Nostr testleri surec ici sahte relay kullaniyor: CI gercek internet
        # relay'lerine bagimli olmasin. Gercek relay'lerle kosum elle:
        # PEERPAGES_E2E_RELAYS="wss://nos.lol" npm run e2e
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
