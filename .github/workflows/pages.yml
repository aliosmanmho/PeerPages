name: Pages

# Deploys the app shell to GitHub Pages (phase 7).
#
# Why a separate workflow, and why it does not repeat the tests: ci.yml
# already runs lint, the unit tests and e2e. Tying the deploy to e2e
# (downloading Chromium, about 4 minutes) would slow publishing down and
# hide the deploy's OWN failure behind the e2e noise. If you do not want a
# red commit reaching the live site, use branch protection; this
# workflow's job is to do one thing.
#
# `web/dist` is NOT KEPT in the repo (.gitignore): the output is built
# here.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "protocol/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# The deploys queue up and are NOT CANCELLED midway: a half-published
# site is worse than a cancelled build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: build and publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Two repository variables (Settings -> Variables):
      #   PAGES_CNAME  a custom domain (for example demo.example.com). When
      #                set, the site is published at the ROOT of that
      #                domain, so base becomes "/" and a CNAME file is
      #                written.
      #   PAGES_BASE   the project page subpath; "/PeerPages/" when unset.
      #
      # The technical gain of a root deploy: the local site's
      # ROOT-ABSOLUTE paths (/style.css) stay inside the Service Worker
      # scope (the structural boundary in BRIEF section 8 goes away).
      - name: Pick the base path
        id: base
        env:
          PAGES_CNAME: ${{ vars.PAGES_CNAME }}
          PAGES_BASE: ${{ vars.PAGES_BASE }}
        run: |
          if [ -n "$PAGES_CNAME" ]; then
            echo "value=/" >> "$GITHUB_OUTPUT"
          else
            echo "value=${PAGES_BASE:-/PeerPages/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Dependencies
        working-directory: web
        run: npm ci

      - name: Build (the app shell, sw.js and ws-shim.js)
        working-directory: web
        run: node scripts/build.mjs "${{ steps.base.outputs.value }}"

      # The expected output files: a deploy quietly missing one would
      # show up on the live site as "the SW could not be installed".
      - name: Check the output
        working-directory: web
        run: |
          test -f dist/index.html
          test -f dist/connect/index.html
          test -f dist/sw.js
          test -f dist/ws-shim.js

      - name: CNAME (when a custom domain was given)
        if: vars.PAGES_CNAME != ''
        run: echo "${{ vars.PAGES_CNAME }}" > web/dist/CNAME

      # enablement: true -> Pages does not have to be turned on by hand
      # in the repository settings, the first run turns it on itself.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - id: deployment
        uses: actions/deploy-pages@v4
