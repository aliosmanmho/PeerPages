name: Release

# On a `v*` tag it produces binaries for all three platforms.
#
# Pushing a tag DOES NOT PUBLISH: goreleaser opens the release as a DRAFT
# (.goreleaser.yaml -> release.draft). The notes get reviewed and it is
# published by hand.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: goreleaser (linux + macos + windows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # goreleaser needs the full history for the change list
          # between tags.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.x"
          cache-dependency-path: agent/go.sum
      # The tests before publishing: even with a tag pushed, red code
      # must not reach a release.
      - name: The agent tests
        working-directory: agent
        run: go test ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
