# The goreleaser configuration (phase 4).
#
# The agent is a nested module (`agent/go.mod`); there is NO go.mod at the
# repo root. That is why builds[].dir points at the module directory and
# the main package sits at the module root (agent/main.go) — the same
# reason `go install .../agent@latest` works.
#
# Local verification (it does not publish):
#   goreleaser check
#   goreleaser release --snapshot --clean
version: 2

project_name: peerpages

before:
  hooks:
    - go -C agent mod download

builds:
  - id: peerpages
    dir: agent
    main: .
    binary: peerpages
    env:
      # Pure Go: cross-compiling should need no C compiler.
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.buildVersion={{ .Version }}
      - -X main.buildCommit={{ .FullCommit }}
      - -X main.buildDate={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: peerpages
    ids: [peerpages]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - src: docs/INSTALL.md
        dst: INSTALL.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  # Opened as a draft: pushing a tag should not publish by accident, and
  # the notes get reviewed by hand.
  draft: true
  prerelease: auto

# Scoop and Homebrew are a DRAFT (BRIEF phase 4: "a tap draft").
#
# The project name was SETTLED in phase 7 (peerpages). Uploading is still
# off, because the tap repositories (aliosmanmho/homebrew-tap,
# aliosmanmho/scoop-bucket) do not exist yet. To turn it on: create the
# repositories, drop skip_upload, and add a token with write access to the
# tap repository to the release workflow.
homebrew_casks:
  - name: peerpages
    ids: [peerpages]
    skip_upload: true
    repository:
      owner: aliosmanmho
      name: homebrew-tap
    homepage: https://github.com/aliosmanmho/PeerPages
    description: Share your localhost with no server (WebRTC + Nostr signaling)

scoops:
  - name: peerpages
    ids: [peerpages]
    skip_upload: true
    repository:
      owner: aliosmanmho
      name: scoop-bucket
    homepage: https://github.com/aliosmanmho/PeerPages
    description: Share your localhost with no server (WebRTC + Nostr signaling)
    license: MIT
