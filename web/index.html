<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>PeerPages</title>
  </head>
  <body>
    <!--
      Bootloader at the scope root.
      =============================
      This page is only seen on the FIRST visit (before the Service Worker
      exists) or while the tunnel is closed. Its job: install the SW and move
      on to the connect screen (connect/).

      While the tunnel is open this URL never gets here: the SW proxies it to
      the root of the local site. That way the visitor sees the site's root at
      "github.io/PeerPages/", the connect screen lives on a separate path, and
      refreshing the tunnel-owner tab does not close the tunnel.

      The text is deliberately not translated: this page is visible for a few
      hundred milliseconds and pulling in the dictionary would cost more than
      it is worth. The connect screen it hands over to is translated.
    -->
    <p id="boot-msg">Preparing PeerPages…</p>
    <noscript>PeerPages needs JavaScript.</noscript>
    <script type="module" src="/src/boot.ts"></script>
  </body>
</html>
